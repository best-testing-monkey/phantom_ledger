[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-ledger"
version = "0.1.0"
description = "Local-first Python paper trading and backtesting engine"
requires-python = ">=3.12"
authors = [
    {name = "Tim Jansen", email = "best.testing.monkey@gmail.com"}
]
dependencies = [
    "typer>=0.12",
    "yfinance>=0.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.24",
    "rich>=13",
    "pydantic>=2.8",
    "apscheduler>=3.10",
    "python-ulid>=2",
    "python-dotenv>=1.0",
    "jinja2>=3.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "starlette>=0.35",
    "python-multipart>=0.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phantom"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]
charts = [
    "plotext>=5.2",
]

[project.scripts]
phantom = "phantom.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
