<div id="clock-panel" class="card"
     hx-get="/api/clock" hx-trigger="every 10s" hx-target="#clock-panel" hx-swap="outerHTML">
  <h2>Simulated Clock</h2>
  {% if simulated_now %}
    <p><strong>{{ simulated_now.strftime('%Y-%m-%d %H:%M') }}</strong></p>
    <div style="margin: 1rem 0; display: flex; gap: 0.5rem;">
      <form method="post" action="/clock/step" style="display:inline;">
        <input type="hidden" name="days" value="-7">
        <button type="submit">← Back 7d</button>
      </form>
      <form method="post" action="/clock/step" style="display:inline;">
        <input type="hidden" name="days" value="-1">
        <button type="submit">← Back 1d</button>
      </form>
      <form method="post" action="/clock/step" style="display:inline;">
        <input type="hidden" name="days" value="1">
        <button type="submit">Forward 1d →</button>
      </form>
      <form method="post" action="/clock/step" style="display:inline;">
        <input type="hidden" name="days" value="7">
        <button type="submit">Forward 7d →</button>
      </form>
    </div>
  {% else %}
    <p class="neutral">Not set — using wall clock.</p>
  {% endif %}
  <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:0.75rem;align-items:flex-end;">
    <form method="post" action="/clock/set" style="display:flex;gap:0.5rem;align-items:flex-end;">
      <div>
        <label for="datetime-input" style="font-size:0.85rem;">Set Date & Time:</label>
        <input type="text" id="datetime-input" name="simulated_now" required
               placeholder="YYYY-MM-DD HH:MM"
               value="{{ simulated_now.strftime('%Y-%m-%d %H:%M') if simulated_now else '' }}"
               pattern="\d{4}-\d{2}-\d{2} \d{2}:\d{2}"
               style="margin-bottom:0;width:14ch;font-family:monospace;">
      </div>
      <button type="submit">Set</button>
    </form>
    {% if account %}
    <form method="post" action="/simulation/run" style="display:inline;">
      <input type="hidden" name="account" value="{{ account.name }}">
      <button type="submit" style="background-color:#27ae60;"
              title="Run backtest engine from earliest pending order date to the simulated clock date">
        ▶ Run Simulation
      </button>
    </form>
    {% endif %}
  </div>
</div>
